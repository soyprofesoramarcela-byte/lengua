<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU - Repaso de Lengua</title>
    <style>
        body { font-family: sans-serif; background: #e8eff1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 500px; width: 100%; text-align: center; }
        .audio-section { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .audio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .audio-link { background: #27ae60; color: white; padding: 10px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.8em; }
        
        /* Ruleta */
        .ruleta-box { background: #f39c12; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #d35400; transition: 0.2s; }
        .ruleta-box:active { transform: translateY(4px); box-shadow: none; }

        .card { background: white; min-height: 250px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); display: flex; justify-content: center; align-items: center; padding: 20px; cursor: pointer; transition: transform 0.6s; transform-style: preserve-3d; position: relative; }
        .card.flipped { transform: rotateY(180deg); }
        .front, .back { backface-visibility: hidden; position: absolute; width: 90%; }
        .back { transform: rotateY(180deg); color: #2980b9; text-align: left; }
        .front { font-size: 1.2em; font-weight: bold; color: #2c3e50; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        button { background: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>MAU: Lengua 46-47</h1>

        <div class="audio-section">
            <p><strong>Elegí tu ritmo (Menú Electivo):</strong></p>
            <div class="audio-grid">
                <a href="https://www.mureka.ai/song-detail/WcP6nv1BeTSTBNKvGXeWbN" target="_blank" class="audio-link">Pop Alegre</a>
                <a href="https://www.mureka.ai/song-detail/E4LvXjPgYKpRvfN1QyV7uT" target="_blank" class="audio-link">Rock Suave</a>
                <a href="https://www.mureka.ai/song-detail/HqJLVorgyxsthbJ3PC6vqv" target="_blank" class="audio-link">Trap Teórico</a>
                <a href="https://www.mureka.ai/song-detail/WcP6nv1BeTSTBNKvGXeWbN" target="_blank" class="audio-link">Estilo Libre</a>
            </div>
        </div>

        <div class="ruleta-box" onclick="ruletaRusa()">
            🎡 TOCÁ PARA ELEGIR TARJETA AL AZAR<br>
            <small>(Ideal para jugar en grupo)</small>
        </div>
        
        <p>Tarjeta <span id="currentNum">1</span> de 30</p>

        <div class="card" id="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="front" id="cardFront">Presioná la ruleta o Siguiente</div>
            <div class="back" id="cardBack">Respuesta</div>
        </div>

        <div class="controls">
            <button onclick="prevCard(event)">Anterior</button>
            <button onclick="nextCard(event)">Siguiente</button>
        </div>
    </div>

    <script>
        const cards = [
            { f: "¿Qué es la Métrica?", b: "Es la medida silábica de los versos contando sílabas según reglas poéticas." },
            { f: "La Sinalefa", b: "Unión de la vocal final de una palabra con la inicial de la siguiente en una sola sílaba." },
            { f: "Regla: Aguda", b: "Si la última palabra es aguda, se suma una sílaba (+1)." },
            { f: "Regla: Esdrújula", b: "Si la última palabra es esdrújula, se resta una sílaba (-1)." },
            { f: "Regla: Grave", b: "Si la última palabra es grave, el número de sílabas no cambia." },
            { f: "Encabalgamiento", b: "Se llama Encabalgamiento (pensalo como 'subirse a un caballo' para seguir viaje). Cuando la frase sigue en el verso de abajo." },
            { f: "Personificación", b: "Atribuir rasgos o acciones humanas a objetos o animales." },
            { f: "Metáfora", b: "Identificar un elemento con otro directamente: 'Tus manos son seda'." },
            { f: "Comparación", b: "Relación de semejanza usando nexos como 'como' o 'parece'." }
            /* ... podrías seguir agregando las 30 aquí ... */
        ];

        let currentIdx = 0;

        function updateCard() {
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('cardFront').innerText = cards[currentIdx].f;
                document.getElementById('cardBack').innerText = cards[currentIdx].b;
                document.getElementById('currentNum').innerText = currentIdx + 1;
            }, 150);
        }

        function ruletaRusa() {
            let vueltas = 0;
            let intervalo = setInterval(() => {
                currentIdx = Math.floor(Math.random() * cards.length);
                updateCard();
                vueltas++;
                if(vueltas > 10) clearInterval(intervalo);
            }, 100);
        }

        function nextCard(e) { e.stopPropagation(); currentIdx = (currentIdx + 1) % cards.length; updateCard(); }
        function prevCard(e) { e.stopPropagation(); currentIdx = (currentIdx - 1 + cards.length) % cards.length; updateCard(); }

        updateCard();
    </script>
</body>
</html>

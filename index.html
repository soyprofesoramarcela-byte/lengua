<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU - Lengua 46-47</title>
    <style>
        :root { --bg: #1a1a2e; --accent: #e94560; --btn-sec: #6a1b9a; }
        body { font-family: sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 10px; margin: 0; overflow-x: hidden; }
        
        .header { text-align: center; margin-bottom: 10px; }
        .header h1 { font-size: 1.1rem; color: #4e9af1; margin: 5px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; max-width: 350px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: #333; color: white; }
        .tab-btn.active { background: var(--btn-sec); }

        .wheel-box { position: relative; width: 220px; height: 220px; margin-bottom: 10px; }
        canvas { width: 100%; height: 100%; transition: transform 3s cubic-bezier(0.1, 0, 0.2, 1); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 20px solid var(--accent); z-index: 10; }

        .btn-main { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 25px; width: 250px; font-weight: bold; cursor: pointer; margin-bottom: 15px; }

        .card-container { perspective: 1000px; width: 320px; height: 160px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; border-radius: 12px; text-align: center; }
        .front { background: white; color: #333; font-weight: bold; font-size: 1rem; border: 2px solid var(--btn-sec); }
        .back { background: #f0f0f0; color: #2980b9; transform: rotateY(180deg); font-size: 0.95rem; font-weight: bold; border: 2px solid var(--accent); }

        .music-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 350px; margin-top: 15px; }
        .btn-music { background: #444; color: white; border: none; padding: 8px; border-radius: 5px; font-size: 0.65rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Matriz de Aprendizaje Ubicuo</h1>
        <div class="tabs">
            <button id="btnAprende" class="tab-btn active" onclick="setMode('aprende')">📖 APRENDE</button>
            <button id="btnDesafio" class="tab-btn" onclick="setMode('desafio')">🔥 TE DESAFÍO</button>
        </div>
    </div>

    <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="canvas" width="300" height="300"></canvas>
    </div>
    
    <button class="btn-main" id="mainAction" onclick="lanzar()">GIRA LA RULETA</button>

    <div class="card-container">
        <div class="card" id="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="front" id="cardFront">¡Elegí un modo y girá!</div>
            <div class="back" id="cardBack">La respuesta aparecerá aquí.</div>
        </div>
    </div>

    <div class="music-grid">
        <button class="btn-music" onclick="playM('URL_1.mp3')">MÉTRICA</button>
        <button class="btn-music" onclick="playM('URL_2.mp3')">RIMAS</button>
        <button class="btn-music" onclick="playM('URL_3.mp3')">RECURSOS</button>
        <button class="btn-music" onclick="playM('URL_4.mp3')">REPASO</button>
    </div>

    <audio id="audio"></audio>

    <script>
        const data = [
            { f: "Sinalefa", b: "Unión de vocal final e inicial en una sola sílaba métrica." },
            { f: "Aguda (+1)", b: "Si el verso termina en palabra aguda, se suma una sílaba." },
            { f: "Esdrújula (-1)", b: "Si el verso termina en esdrújula, se resta una sílaba." },
            { f: "Grave (=)", b: "Si el verso termina en grave, el conteo no varía." },
            { f: "Metáfora", b: "Identificar un elemento con otro por semejanza (A es B)." },
            { f: "Comparación", b: "Relación de semejanza usando nexos (como, parece)." },
            { f: "Personificación", b: "Atribuir rasgos humanos a objetos o animales." },
            { f: "Encabalgamiento", b: "Cuando el sentido de un verso continúa en el siguiente." },
            { f: "Rima Consonante", b: "Coinciden todos los sonidos desde el último acento." },
            { f: "Rima Asonante", b: "Solo coinciden las vocales desde el último acento." },
            { f: "Octosílabo", b: "Verso que tiene ocho sílabas métricas." },
            { f: "Métrica (Definición)", b: "Es la medida silábica de los versos siguiendo reglas poéticas." },
            { f: "Imagen Visual", b: "Recurso que evoca algo percibido por la vista." },
            { f: "Imagen Auditiva", b: "Recurso que evoca sonidos o ruidos." },
            { f: "Imagen Táctil", b: "Sensación percibida por el tacto." },
            { f: "Verso Libre", b: "Sin medida fija ni rima, con ritmo interno." },
            { f: "Rima (Definición)", b: "Coincidencia de sonidos a partir de la última vocal acentuada." },
            { f: "Imagen Gustativa", b: "Recurso sensorial que evoca sabores (ej: dulce, amargo)." },
            { f: "Imagen Olfativa", b: "Recurso sensorial que evoca olores o fragancias." },
            { f: "Recursos Literarios", b: "Herramientas que usa el autor para dar belleza y ritmo al texto." },
            { f: "Estrofa", b: "Conjunto de versos agrupados en una unidad dentro del poema." },
            { f: "Poema", b: "Composición literaria escrita en verso que expresa subjetividad." },
            { f: "Ritmo Poético", b: "Musicalidad lograda por la distribución de acentos y pausas." },
            { f: "Licencia Poética", b: "Recursos como la sinalefa que permiten ajustar la medida." },
            { f: "Semáforo de Rima", b: "Técnica visual para marcar rimas consonantes y asonantes." },
            { f: "Última vocal acentuada", b: "Referencia para determinar dónde empieza la rima." },
            { f: "Unidad Sintáctica", b: "Sentido de la frase que desborda el verso (encabalgamiento)." },
            { f: "Identidad Directa", b: "Característica de la Metáfora: un objeto 'es' otro." },
            { f: "Nexo Comparativo", b: "Palabras como 'como' o 'cual' que definen la Comparación." },
            { f: "Sentido Figurado", b: "Uso de palabras con un significado distinto al literal." }
        ];

        let mode = 'aprende';
        let rotation = 0;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#f1c40f','#e67e22','#e74c3c','#9b59b6','#3498db','#2ecc71','#1abc9c','#ecf0f1','#95a5a6','#d35400'];

        function setMode(m) {
            mode = m;
            document.getElementById('btnAprende').classList.toggle('active', m === 'aprende');
            document.getElementById('btnDesafio').classList.toggle('active', m === 'desafio');
            document.getElementById('mainAction').innerText = m === 'aprende' ? 'GIRA LA RULETA' : '¡DAME UN DESAFÍO!';
        }

        function draw() {
            let slice = (Math.PI * 2) / data.length;
            for(let i=0; i<data.length; i++) {
                ctx.beginPath(); ctx.fillStyle = colors[i % colors.length]; ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, i * slice, (i+1) * slice); ctx.fill();
            }
        }

        function lanzar() {
            rotation += (Math.floor(Math.random() * 360) + 1440);
            canvas.style.transform = `rotate(${rotation}deg)`;
            document.getElementById('flashcard').classList.remove('flipped');
            setTimeout(() => {
                const res = data[Math.floor(Math.random() * data.length)];
                document.getElementById('cardFront').innerText = mode === 'aprende' ? res.f : "¿Qué es " + res.f + "?";
                document.getElementById('cardBack').innerText = res.b;
            }, 3000);
        }

        const audio = document.getElementById('audio');
        function playM(url) {
            if(audio.src.includes(url) && !audio.paused) audio.pause();
            else { audio.src = url; audio.play(); }
        }
        draw();
    </script>
</body>
</html>

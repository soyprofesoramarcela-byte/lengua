<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU - Matriz de Aprendizaje Ubicuo</title>
    <style>
        :root {
            --neon-pink: #FF006E;
            --neon-purple: #8338EC;
            --neon-blue: #3A86FF;
            --bg-dark: #0F0C29;
            --card-dark: #1A1A2E;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #F5F5F7; margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px; overflow-x: hidden;
        }

        .header { text-align: center; margin-bottom: 10px; width: 100%; max-width: 450px; }
        .titulo-mau { font-size: 1.1rem; font-weight: 800; color: var(--neon-blue); margin: 0; }
        .subtitulo-mau { font-size: 0.75rem; opacity: 0.9; margin: 3px 0; color: #fff; }
        .info-linea { border-top: 1px solid #444; border-bottom: 1px solid #444; padding: 8px; margin-top: 8px; font-weight: bold; font-size: 0.85rem; color: var(--neon-pink); }

        .tabs { display: flex; gap: 8px; width: 100%; max-width: 450px; margin: 10px 0; }
        .tab { flex: 1; padding: 10px; border: 2px solid var(--neon-purple); border-radius: 12px; background: transparent; color: white; font-weight: bold; cursor: pointer; font-size: 0.8em; }
        .tab.active { background: var(--neon-purple); box-shadow: 0 0 10px var(--neon-purple); }

        .panel { display: none; width: 100%; max-width: 450px; flex-direction: column; align-items: center; }
        .panel.active { display: flex; }

        .music-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; width: 100%; margin-bottom: 10px; }
        .music-btn { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-blue); 
            color: var(--neon-blue); padding: 8px 0; border-radius: 6px; font-size: 0.5rem; 
            font-weight: bold; text-align: center; cursor: pointer; text-decoration: none;
        }

        .card { background: var(--card-dark); width: 100%; min-height: 160px; border-radius: 15px; perspective: 1000px; cursor: pointer; border: 1px solid #333; margin: 5px 0; }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; min-height: 160px; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; text-align: center; border-radius: 15px; }
        .back { transform: rotateY(180deg); color: var(--neon-blue); font-weight: bold; background: #16213e; font-size: 0.85rem; line-height: 1.3; }
        .instruccion { font-size: 0.6rem; color: var(--neon-pink); margin-top: 10px; font-weight: bold; text-transform: uppercase; }

        .wheel-container { position: relative; width: 180px; height: 180px; margin: 10px 0; }
        .pointer { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 22px solid white; z-index: 10; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 4px solid white; background: conic-gradient(#FF006E 0deg 45deg, #FFBE0B 45deg 90deg, #FB5607 90deg 135deg, #8338EC 135deg 180deg, #3A86FF 180deg 225deg, #00F5D4 225deg 270deg, #FF006E 270deg 315deg, #FFBE0B 315deg 360deg); transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }

        .btn-spin { background: var(--neon-pink); color: white; border: none; padding: 10px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px var(--neon-pink); margin: 10px 0; }
        .nav-btn { flex: 1; background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="header">
        <div class="titulo-mau">Matriz de Aprendizaje Ubicuo (MAU)</div>
        <div class="subtitulo-mau">Innovación en Dispositivos Digitales Autogestivos</div>
        <div class="info-linea">Materia: Lengua - Recursos Poéticos y Canciones</div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('aprender', this)">📖 APRENDE</button>
        <button class="tab" onclick="switchTab('jugar', this)">🔥 DESAFÍO</button>
    </div>

    <div id="panel-aprender" class="panel active">
        <div class="music-grid">
            <a href="https://www.mureka.ai/song-detail/E4LvXjPgYKpRvfN1QyV7uT?is_from_share=1" target="_blank" class="music-btn">♫ CANCIÓN 1</a>
            <a href="https://www.mureka.ai/song-detail/HqJLVorgyxsthbJ3PC6vqv?is_from_share=1" target="_blank" class="music-btn">♫ CANCIÓN 2</a>
            <a href="https://www.mureka.ai/song-detail/7nhGphDu4QyWq1h9YLpCNJ?is_from_share=1" target="_blank" class="music-btn">♫ CANCIÓN 3</a>
            <a href="https://www.mureka.ai/song-detail/HH2cL4tVjsC9iq1iWfWfAB?is_from_share=1" target="_blank" class="music-btn">♫ CANCIÓN 4</a>
        </div>

        <div id="numAprender" style="font-size: 0.8rem; margin-bottom: 5px; opacity: 0.7;">1 / 28</div>
        <div class="card" onclick="this.classList.toggle('flipped')">
            <div class="card-inner">
                <div class="front"><div id="fAprender" style="font-size: 1.1em; font-weight: bold;">Cargando...</div><div class="instruccion">TOCA PARA VER EXPLICACIÓN</div></div>
                <div class="back" id="bAprender">...</div>
            </div>
        </div>
        <div style="display:flex; gap:10px; width:100%; margin-top: 10px;">
            <button class="nav-btn" onclick="move(-1)">← ANTERIOR</button>
            <button class="nav-btn" onclick="move(1)">SIGUIENTE →</button>
        </div>
    </div>

    <div id="panel-jugar" class="panel">
        <div class="wheel-container"><div class="pointer"></div><div class="wheel" id="wheel"></div></div>
        <button class="btn-spin" onclick="spinWheel()">GIRA LA RULETA</button>
        <div class="card" id="cardJuego" onclick="this.classList.toggle('flipped')">
            <div class="card-inner">
                <div class="front">
                    <div id="fJuego" style="font-size: 1.1em; font-weight: bold;">¡Gira!</div>
                    <div class="instruccion">¿QUÉ SIGNIFICA?</div>
                </div>
                <div class="back" id="bJuego">...</div>
            </div>
        </div>
    </div>

    <script>
        const cards = [
            { f: "Metáfora", b: "Establece una identidad total entre dos elementos (A es B). Ej: 'Las perlas de tu boca'. Identifica los dientes como perlas sin usar nexos." },
            { f: "Aliteración", b: "Repetición de un mismo sonido (generalmente consonante). Ej: 'El sonido sonoro de la selva'. Imita sonidos de la realidad (viento o siseo)." },
            { f: "Sinalefa", b: "Unión de la vocal final de una palabra con la inicial de la siguiente en una sola sílaba métrica." },
            { f: "Rima Consonante", b: "Coinciden vocales y consonantes desde la última vocal tónica. Ej: 'Canci-ÓN' / 'Coraz-ÓN'." },
            { f: "Rima Asonante", b: "Solo coinciden las vocales desde la última vocal tónica. Ej: 'C-A-s-A' / 'p-A-m-A'." },
            { f: "Acento Agudo (+1)", b: "Si la última palabra del verso es aguda, se suma una sílaba al conteo métrico." },
            { f: "Acento Esdrújulo (-1)", b: "Si la última palabra del verso es esdrújula, se resta una sílaba métrica." },
            { f: "Acento Grave (0)", b: "Si la última palabra es grave, el número de sílabas se mantiene igual." },
            { f: "Comparación", b: "Relación de semejanza entre dos elementos usando nexos como 'como' o 'parece'." },
            { f: "Personificación", b: "Atribuir características o acciones humanas a objetos o animales." },
            { f: "Anáfora", b: "Repetición de palabras al inicio del verso para dar énfasis o ritmo." },
            { f: "Encabalgamiento", b: "Cuando la idea de un verso continúa en el siguiente sin pausa gramatical." },
            { f: "Octosílabo", b: "Verso de ocho sílabas métricas. Muy común en canciones populares." },
            { f: "Métrica", b: "Es la medida de las sílabas de un verso siguiendo reglas y licencias poéticas." },
            { f: "Imagen Visual", b: "Recurso sensorial que representa lo percibido por la vista (colores, formas)." },
            { f: "Imagen Auditiva", b: "Palabras que evocan sonidos, ruidos o sensaciones sonoras." },
            { f: "Estrofa", b: "Conjunto de versos agrupados en una unidad dentro del poema." },
            { f: "Verso", b: "Es cada una de las líneas que conforman el cuerpo de un poema o canción." },
            { f: "Ritmo", b: "Efecto logrado por la distribución de acentos, pausas y medida silábica." },
            { f: "Imagen Táctil", b: "Recurso sensorial que remite a sensaciones de la piel (frío, rugoso)." },
            { f: "Imagen Gustativa", b: "Evoca sabores y sensaciones del gusto (dulce, amargo, ácido)." },
            { f: "Imagen Olfativa", b: "Términos que evocan aromas, perfumes o fragancias." },
            { f: "Estribillo", b: "Grupo de versos que se repite a intervalos fijos en una composición." },
            { f: "Sinalefa con 'H'", b: "La 'h' inicial no impide la sinalefa, ya que no tiene sonido." },
            { f: "Verso Libre", b: "Verso que no sigue una rima ni una métrica fija establecida." },
            { f: "Recurso Poético", b: "Herramienta expresiva para embellecer o dar ritmo al texto." },
            { f: "Pausa Versal", b: "Pequeño silencio o interrupción al finalizar cada verso." },
            { f: "Musicalidad", b: "Efecto estético que resulta de combinar rima, métrica y acentos." }
        ];

        let idx = 0;
        let rotation = 0;

        function switchTab(m, b) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            b.classList.add('active');
            document.getElementById('panel-'+m).classList.add('active');
        }

        function move(dir) {
            idx = (idx + dir + cards.length) % cards.length;
            document.querySelector('#panel-aprender .card').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('fAprender').innerText = cards[idx].f;
                document.getElementById('bAprender').innerText = cards[idx].b;
                document.getElementById('numAprender').innerText = (idx + 1) + " / 28";
            }, 150);
        }

        function spinWheel() {
            rotation += 1440 + Math.floor(Math.random() * 360);
            document.getElementById('wheel').style.transform = `rotate(${rotation}deg)`;
            document.getElementById('cardJuego').classList.remove('flipped');
            setTimeout(() => {
                const r = Math.floor(Math.random() * cards.length);
                document.getElementById('fJuego').innerText = cards[r].f;
                document.getElementById('bJuego').innerText = cards[r].b;
            }, 4000);
        }

        move(0);
    </script>
</body>
</html>

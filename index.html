<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU - Matriz de Aprendizaje Ubicuo</title>
    <style>
        :root {
            /* Tu Paleta: Oscuros y Dorados con Tipografía Apple */
            --bg-color: #0a0a0a;
            --card-bg: #1a1a1a;
            --accent-gold: #c5a059;
            --text-white: #f5f5f7;
            --text-gray: #86868b;
            --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
        }

        body {
            font-family: var(--apple-font);
            background-color: var(--bg-color);
            color: var(--text-white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        header { text-align: center; margin-top: 20px; }
        h1 { font-weight: 600; font-size: 32px; letter-spacing: -0.5px; margin: 0; color: var(--accent-gold); }
        .subtitulo { color: var(--text-gray); font-size: 16px; margin-top: 5px; }

        /* Contenedor de la Ruleta Mágica */
        .ruleta-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 40px auto;
        }

        /* Varilla Indicadora Superior */
        .varilla {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 30px;
            background: var(--accent-gold);
            border-radius: 2px;
            z-index: 10;
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.5);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        button {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 17px;
            border-radius: 980px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:active { transform: scale(0.95); }

        #display-carta {
            max-width: 450px;
            margin-top: 30px;
            padding: 20px;
            border-radius: 14px;
            background: var(--card-bg);
            border: 1px solid #333;
            text-align: left;
            min-height: 120px;
        }

        .carta-titulo { color: var(--accent-gold); font-weight: 600; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<header>
    <h1>MAU</h1>
    <p class="subtitulo">Dispositivo Digital Autogestivo · Págs. 46-47</p>
</header>

<div class="ruleta-wrapper">
    <div class="varilla"></div>
    <canvas id="ruletaCanvas" width="320" height="320"></canvas>
</div>

<button onclick="girar()">Girar Ruleta</button>

<div id="display-carta">
    <span class="carta-titulo">Instrucciones</span>
    <p style="color:var(--text-gray); margin:0;">Inicie el giro para explorar los conceptos de rima asonante y métrica de las páginas 46 y 47.</p>
</div>

<script>
    const canvas = document.getElementById("ruletaCanvas");
    const ctx = canvas.getContext("2d");
    
    // Contenido basado en las Páginas 46 y 47
    const cartas = [
        "**Rima Asonante:** Coincidencia sonora de vocales a partir de la tónica.",
        "**Vocales Tónicas:** Núcleo donde se produce la identidad sonora asonante.",
        "**Métrica Española:** Análisis de la estructura del verso según las págs. 46-47.",
        "**Ejemplo A-A:** Análisis de rima en palabras como 'rama' y 'clara'.",
        "**Musicalidad:** La asonancia permite un ritmo más fluido y natural.",
        "**Identidad Fonética:** Proceso de ignorar consonantes en el análisis asonante.",
        "**Verso Octosílabo:** Relación entre rima asonante y el arte menor.",
        "**Acento Final:** Regla fundamental para determinar el tipo de rima.",
        "**Asonancia en Diptongos:** Cómo se computa la vocal fuerte según la pág. 47.",
        "**Libertad Lírica:** La asonancia como recurso frente a la rima consonante.",
        "**Terminaciones Agudas:** Ajuste del conteo y rima en palabras oxítonas.",
        "**Sinalefa y Rima:** Interacción rítmica descrita en la sección técnica.",
        "**Pág. 46: Teoría:** La importancia de la percepción auditiva de la vocal.",
        "**Pág. 47: Práctica:** Aplicación de asonancia en el romance tradicional.",
        "**Vocal Débil:** Su rol nulo en la rima asonante según el manual.",
        "**Esdrújulas:** Cómo se desplaza la rima en palabras con acento antepenúltimo.",
        "**Consonantes Intermedias:** Por qué se consideran 'invisibles' en la asonancia.",
        "**Ritmo Interno:** El efecto de las vocales repetidas en la estrofa.",
        "**Pares e Impares:** Esquema de rima habitual en la asonancia clásica.",
        "**Timbre Vocálico:** La calidad del sonido que define la coincidencia.",
        "**Ejemplo E-O:** Rima asonante entre 'viento' y 'beso'.",
        "**Ejemplo I-A:** Rima asonante entre 'mirlo' y 'brillo'.",
        "**Variante Estilística:** Uso de asonancia para evitar la monotonía.",
        "**Tradición Oral:** Por qué la asonancia facilita la memorización.",
        "**Análisis de Texto:** Paso 1: Localizar la última vocal acentuada.",
        "**Análisis de Texto:** Paso 2: Comparar solo timbres vocálicos.",
        "**Análisis de Texto:** Paso 3: Descartar grafemas consonánticos.",
        "**Recurso de Autor:** La elección consciente de la asonancia sobre la consonancia.",
        "**Evolución Poética:** De la rima rígida a la libertad de la asonancia.",
        "**Resumen Final:** La MAU garantiza el dominio de las págs. 46 y 47."
    ];

    let anguloActual = 0;
    const numSectores = 30;
    const arco = Math.PI * 2 / numSectores;

    function dibujar() {
        ctx.clearRect(0,0,320,320);
        for (let i = 0; i < numSectores; i++) {
            const ang = i * arco;
            ctx.fillStyle = i % 2 === 0 ? "#1a1a1a" : "#111111";
            ctx.beginPath();
            ctx.moveTo(160, 160);
            ctx.arc(160, 160, 155, ang, ang + arco);
            ctx.strokeStyle = "#333";
            ctx.stroke();
            ctx.fill();
            
            ctx.save();
            ctx.translate(160 + Math.cos(ang + arco/2) * 130, 160 + Math.sin(ang + arco/2) * 130);
            ctx.rotate(ang + arco/2 + Math.PI/2);
            ctx.fillStyle = "#555";
            ctx.font = "bold 9px sans-serif";
            ctx.fillText(i + 1, -5, 0);
            ctx.restore();
        }
    }

    function girar() {
        const giroExtra = Math.floor(Math.random() * 360) + 1440;
        anguloActual += giroExtra;
        canvas.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)";
        canvas.style.transform = `rotate(${anguloActual}deg)`;

        setTimeout(() => {
            const gradosReales = anguloActual % 360;
            const indice = Math.floor(numSectores - (gradosReales / (360 / numSectores))) % numSectores;
            const contenido = cartas[indice].split("**");
            
            document.getElementById("display-carta").innerHTML = `
                <span class="carta-titulo">${contenido[1]}</span>
                <p style="margin:0; line-height:1.5;">${contenido[2]}</p>
            `;
        }, 4000);
    }

    dibujar();
</script>
</body>
</html>

    const ctx = canvas.getContext("2d");

    // AQUÍ ESTÁN LAS 30 CARTAS CON SU CONTENIDO ÍNTEGRO
    // Reemplazá los textos entre comillas con tu material original del Ministerio

        "Contenido completo de la Carta 1: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 2: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 3: [Pegar aquí el texto original]",

        "Contenido completo de la Carta 15: [Pegar aquí el texto original]",

        "Contenido completo de la Carta 18: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 19: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 20: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 21: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 22: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 23: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 24: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 25: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 26: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 27: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 28: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 29: [Pegar aquí el texto original]",
        "Contenido completo de la Carta 30: [Pegar aquí el texto original]"
    ];
    
    let anguloActual = 0;
    const numSectores = 30;
    const arco = Math.PI * 2 / numSectores;

    function dibujarRuleta() {
        ctx.clearRect(0,0,320,320);
        for (let i = 0; i < numSectores; i++) {
            const ang = i * arco;
            ctx.fillStyle = i % 2 === 0 ? "#ffffff" : "#f9f9f9"; // Blanco Apple / Gris muy claro
            ctx.beginPath();
            ctx.moveTo(160, 160);
            ctx.arc(160, 160, 160, ang, ang + arco);
            ctx.strokeStyle = "#e5e5e7"; // Separadores sutiles
            ctx.stroke();
            ctx.fill();
            
            // Números de los sectores
            ctx.save();
            ctx.translate(160 + Math.cos(ang + arco / 2) * 135, 160 + Math.sin(ang + arco / 2) * 135);
            ctx.rotate(ang + arco / 2 + Math.PI / 2);
            ctx.fillStyle = "#86868b";
            ctx.font = "bold 10px sans-serif";
            ctx.fillText(i + 1, -5, 0);
            ctx.restore();
        }
    }

    function girar() {
        const giroExtra = Math.floor(Math.random() * 360) + 1440; 
        anguloActual += giroExtra;
        canvas.style.transition = "transform 4s cubic-bezier(0.15, 0, 0.15, 1)";
        canvas.style.transform = `rotate(${anguloActual}deg)`;

        setTimeout(() => {
            // Cálculo preciso para que coincida con la varilla superior
            const gradosReales = anguloActual % 360;
            const indice = Math.floor(numSectores - (gradosReales / (360 / numSectores))) % numSectores;
            
            // Mostrar la carta íntegra con diseño limpio
            document.getElementById("carta-display").innerHTML = `
                <h3 style="color:var(--apple-blue); margin-top:0;">CARTA ${indice + 1}</h3>
                <div style="text-align:left; font-size:16px; line-height:1.6;">${cartas[indice]}</div>
            `;
        }, 4000);
    }

    dibujarRuleta();
</script>

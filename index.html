<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU - Lengua - Recursos Poéticos</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #ffffff;
            --primary-accent: #e94560;
            --secondary-accent: #6a1b9a;
            --text-main: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 { font-size: 1.2rem; color: #4e9af1; margin: 5px 0; }
        .header p { font-size: 0.9rem; margin: 0; opacity: 0.8; }

        /* CONTENEDOR PRINCIPAL: Flexbox responsivo */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 900px;
        }

        /* SECCIÓN RULETA: Tamaño controlado */
        .wheel-section {
            width: 260px; /* Tamaño reducido para móviles */
            text-align: center;
        }

        canvas {
            width: 100% !important;
            height: auto !important;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .btn-gira {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
            width: 100%;
        }

        /* SECCIÓN FLASHCARD */
        .card-section {
            width: 100%;
            max-width: 350px;
            perspective: 1000px;
        }

        .card {
            background-color: var(--card-bg);
            color: #333;
            height: 200px;
            border-radius: 15px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .card.flipped { transform: rotateY(180deg); }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            font-size: 1rem;
            border-radius: 15px;
        }

        .back {
            transform: rotateY(180deg);
            background-color: #f8f9fa;
            color: #2980b9;
            font-weight: bold;
        }

        /* BOTONES DE MÚSICA */
        .music-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-music {
            background: var(--secondary-accent);
            color: white;
            border: none;
            padding: 8px;
            font-size: 0.75rem;
            border-radius: 5px;
            cursor: pointer;
        }

        /* ADAPTACIÓN PARA PANTALLAS GRANDES */
        @media (min-width: 768px) {
            .game-container {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
                margin-top: 20px;
            }
            .wheel-section { width: 320px; }
            .card-section { width: 400px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Matriz de Aprendizaje Ubicuo (MAU)</h1>
        <p>Lengua - Recursos Poéticos y Canciones</p>
    </div>

    <div class="game-container">
        <div class="wheel-section">
            <canvas id="canvas" width="300" height="300"></canvas>
            <button class="btn-gira" onclick="giraRuleta()">GIRA LA RULETA</button>
            
            <div class="music-grid">
                <button class="btn-music" onclick="reproducir('https://www.mureka.ai/song-detail/E4LvXjPgYKpRvfN1QyV7uT?is_from_share=1')">🎵 Métrica</button>
                <button class="btn-music" onclick="reproducir('https://www.mureka.ai/song-detail/HqJLVorgyxsthbJ3PC6vqv?is_from_share=1')">🎵 Rimas</button>
                <button class="btn-music" onclick="reproducir('https://www.mureka.ai/song-detail/7nhGphDu4QyWq1h9YLpCNJ?is_from_share=1')">🎵 Recursos</button>
                <button class="btn-music" onclick="reproducir('https://www.mureka.ai/song-detail/HH2cL4tVjsC9iq1iWfWfAB?is_from_share=1')">🎵 Repaso</button>
            </div>
        </div>

        <div class="card-section">
            <div class="card" id="flashcard" onclick="this.classList.toggle('flipped')">
                <div class="front" id="cardFront">¡Gira la ruleta para obtener una definición!</div>
                <div class="back" id="cardBack">Aquí aparecerá la explicación técnica.</div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const cards = [
            { f: "Sinalefa", b: "Unión de vocal final e inicial en una sola sílaba métrica." },
            { f: "Palabra Aguda", b: "Si el verso termina en aguda, se suma una sílaba (+1)." },
            { f: "Palabra Esdrújula", b: "Si el verso termina en esdrújula, se resta una sílaba (-1)." },
            { f: "Metáfora", b: "Identificar un elemento con otro de forma directa (A es B)." },
            { f: "Comparación", b: "Relación de semejanza usando 'como' o 'parece'." },
            { f: "Personificación", b: "Atribuir rasgos o acciones humanas a objetos o animales." },
            { f: "Encabalgamiento", b: "Cuando el sentido de un verso continúa en el siguiente." },
            { f: "Rima Consonante", b: "Coincidencia total de sonidos (vocales y consonantes)." }
        ];

        // Lógica de la Ruleta
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#f1c40f', '#e67e22', '#e74c3c', '#9b59b6', '#3498db', '#2ecc71', '#1abc9c', '#34495e'];
        let angle = 0;

        function drawWheel() {
            const slice = (Math.PI * 2) / cards.length;
            cards.forEach((card, i) => {
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, i * slice, (i + 1) * slice);
                ctx.fill();
            });
        }

        function giraRuleta() {
            const rand = Math.floor(Math.random() * cards.length);
            const card = document.getElementById('flashcard');
            card.classList.remove('flipped');
            
            document.getElementById('cardFront').innerText = cards[rand].f;
            document.getElementById('cardBack').innerText = cards[rand].b;
        }

        // Lógica del Reproductor Único
        const player = document.getElementById('audioPlayer');
        function reproducir(url) {
            if (player.src.includes(url) && !player.paused) {
                player.pause();
            } else {
                player.src = url;
                player.play();
            }
        }

        drawWheel();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAU - Lengua</title>
    <style>
        :root { --bg: #1a1a2e; --accent: #e94560; --btn-sec: #6a1b9a; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 5px; margin: 0; overflow: hidden; height: 100vh; }
        
        .header h1 { font-size: 0.85rem; color: #4e9af1; margin: 2px 0; text-align: center; }

        /* Pestañas */
        .tabs { display: flex; gap: 5px; margin-bottom: 5px; width: 95%; max-width: 300px; }
        .tab-btn { flex: 1; padding: 6px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #333; color: white; font-size: 0.7rem; }
        .tab-btn.active { background: var(--btn-sec); }

        /* Ruleta de 180px para que entre en una sola pantalla */
        .wheel-box { position: relative; width: 180px; height: 180px; margin-bottom: 5px; }
        canvas { width: 100%; height: 100%; transition: transform 3s cubic-bezier(0.1, 0, 0.2, 1); border-radius: 50%; }
        .pointer { position: absolute; top: -5px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 15px solid var(--accent); z-index: 10; }

        .btn-main { background: var(--accent); color: white; border: none; padding: 8px; border-radius: 20px; width: 200px; font-weight: bold; cursor: pointer; font-size: 0.8rem; margin-bottom: 5px; box-shadow: 0 3px 6px rgba(0,0,0,0.3); }

        /* Flashcard Compacta */
        .card-container { perspective: 1000px; width: 90%; max-width: 300px; height: 120px; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; }
        .card.flipped { transform: rotateY(180deg); }
        .front, .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .front { background: white; color: #333; font-weight: bold; font-size: 0.8rem; border: 2px solid var(--btn-sec); }
        .back { background: #f8f9fa; color: #1a1a2e; transform: rotateY(180deg); font-size: 0.75rem; border: 2px solid var(--accent); font-weight: bold; }

        /* Botones de Música */
        .music-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 95%; max-width: 320px; margin-top: 8px; }
        .btn-music { background: #444; color: white; border: none; padding: 6px 1px; border-radius: 4px; font-size: 0.5rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Aprendizaje Ubicuo - Lengua</h1>
        <div class="tabs">
            <button id="btnAprende" class="tab-btn active" onclick="setMode('aprende')">📖 APRENDE</button>
            <button id="btnDesafio" class="tab-btn" onclick="setMode('desafio')">🔥 DESAFÍO</button>
        </div>
    </div>

    <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="canvas" width="300" height="300"></canvas>
    </div>
    
    <button class="btn-main" id="mainAction" onclick="lanzar()">GIRA LA RULETA</button>

    <div class="card-container">
        <div class="card" id="flashcard" onclick="this.classList.toggle('flipped')">
            <div class="front" id="cardFront">¡Toca para girar!</div>
            <div class="back" id="cardBack">La respuesta aparecerá aquí.</div>
        </div>
    </div>

    <div class="music-grid">
        <button class="btn-music" onclick="playM('URL_1')">MÉTRICA</button>
        <button class="btn-music" onclick="playM('URL_2')">RIMAS</button>
        <button class="btn-music" onclick="playM('URL_3')">RECURSOS</button>
        <button class="btn-music" onclick="playM('URL_4')">REPASO</button>
    </div>

    <audio id="audio"></audio>

    <script>
        const data = [
            { f: "Sinalefa", b: "Unión de vocal final e inicial en una sola sílaba métrica." },
            { f: "Aguda (+1)", b: "Si el verso termina en palabra aguda, se suma una sílaba." },
            { f: "Esdrújula (-1)", b: "Si el verso termina en esdrújula, se resta una sílaba." },
            { f: "Grave (=)", b: "Si el verso termina en grave, el conteo no varía." },
            { f: "Metáfora", b: "Identificar un elemento con otro por semejanza (A es B)." },
            { f: "Comparación", b: "Relación de semejanza usando nexos (como, parece)." },
            { f: "Personificación", b: "Atribuir rasgos humanos a objetos o animales." },
            { f: "Encabalgamiento", b: "Cuando el sentido de un verso continúa en el siguiente." },
            { f: "Rima Consonante", b: "Coinciden todos los sonidos desde el último acento." },
            { f: "Rima Asonante", b: "Solo coinciden las vocales desde el último acento." },
            { f: "Octosílabo", b: "Verso que tiene ocho sílabas métricas." },
            { f: "Imagen Visual", b: "Recurso sensorial que evoca algo percibido por la vista." },
            { f: "Imagen Auditiva", b: "Recurso sensorial que evoca sonidos o ruidos." },
            { f: "Imagen Táctil", b: "Sensación percibida por el tacto (ej: frío, suave)." },
            { f: "Verso Libre", b: "Sin medida fija ni rima, pero con ritmo interno." },
            { f: "Métrica", b: "Medida silábica de los versos según reglas poéticas." },
            { f: "Rima", b: "Coincidencia de sonidos a partir de la última vocal acentuada." },
            { f: "Imagen Gustativa", b: "Recurso sensorial que evoca sabores (ej: dulce)." },
            { f: "Imagen Olfativa", b: "Recurso sensorial que evoca olores o fragancias." },
            { f: "Recursos Literarios", b: "Herramientas del autor para dar belleza y ritmo al texto." },
            { f: "Estrofa", b: "Conjunto de versos agrupados en una unidad del poema." },
            { f: "Poema", b: "Composición literaria en verso que expresa sentimientos." },
            { f: "Ritmo Poético", b: "Musicalidad lograda por acentos, pausas y medida." },
            { f: "Licencia Poética", b: "Recursos como la sinalefa para ajustar la métrica." },
            { f: "Semáforo de Rima", b: "Técnica visual para marcar coincidencias de sonidos finales." },
            { f: "Última vocal acentuada", b: "Referencia para determinar dónde empieza la rima." },
            { f: "Unidad Sintáctica", b: "El sentido de la frase que desborda el verso (encabalgamiento)." },
            { f: "Identidad Directa", b: "Característica de la Metáfora: un objeto 'es' otro." },
            { f: "Nexo Comparativo", b: "Palabras como 'como' que definen la Comparación." },
            { f: "Sentido Figurado", b: "Uso de palabras con significado distinto al literal." }
        ];

        let mode = 'aprende';
        let rotation = 0;
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#f1c40f','#e67e22','#e74c3c','#9b59b6','#3498db','#2ecc71','#1abc9c','#ecf0f1','#95a5a6','#d35400'];

        function setMode(m) {
            mode = m;
            document.getElementById('btnAprende').classList.toggle('active', m === 'aprende');
            document.getElementById('btnDesafio').classList.toggle('active', m === 'desafio');
            document.getElementById('mainAction').innerText = m === 'aprende' ? 'GIRA LA RULETA' : '¡DAME UN DESAFÍO!';
        }

        function draw() {
            let slice = (Math.PI * 2) / data.length;
            for(let i=0; i<data.length; i++) {
                ctx.beginPath(); ctx.fillStyle = colors[i % colors.length]; ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, i * slice, (i+1) * slice); ctx.fill();
            }
        }

        function lanzar() {
            rotation += (Math.floor(Math.random() * 360) + 1440);
            canvas.style.transform = `rotate(${rotation}deg)`;
            document.getElementById('flashcard').classList.remove('flipped');

            setTimeout(() => {
                const res = data[Math.floor(Math.random() * data.length)];
                document.getElementById('cardFront').innerText = mode === 'aprende' ? res.f : "¿Qué es " + res.f + "?";
                document.getElementById('cardBack').innerText = res.b;
            }, 3000);
        }

        const audio = document.getElementById('audio');
        function playM(url) {
            if(audio.src.includes(url) && !audio.paused) audio.pause();
            else { audio.src = url; audio.play(); }
        }

        draw();
    </script>
</body>
</html>

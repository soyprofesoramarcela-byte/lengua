<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAU - Matriz de Aprendizaje Ubicuo</title>
    <style>
        :root {
            --neon-pink: #FF006E;
            --neon-purple: #8338EC;
            --neon-blue: #3A86FF;
            --bg-dark: #0F0C29;
            --card-dark: #1A1A2E;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #F5F5F7; margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px;
        }

        /* Títulos solicitados */
        .header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 450px; }
        .titulo-mau { font-size: 1.1em; font-weight: 800; color: var(--neon-blue); margin: 0; }
        .subtitulo-mau { font-size: 0.8em; opacity: 0.9; margin: 5px 0; }
        .subtitulo-especifico { font-size: 0.75em; color: var(--neon-pink); font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        .info-linea { border-top: 1px solid #444; border-bottom: 1px solid #444; padding: 10px; margin-top: 10px; font-weight: bold; font-size: 0.9em; }

        .tabs { display: flex; gap: 8px; width: 100%; max-width: 450px; margin: 15px 0; }
        .tab { 
            flex: 1; padding: 12px; border: 2px solid var(--neon-purple); border-radius: 12px; 
            background: transparent; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.85em;
        }
        .tab.active { background: var(--neon-purple); box-shadow: 0 0 15px var(--neon-purple); }

        .panel { display: none; width: 100%; max-width: 450px; flex-direction: column; align-items: center; }
        .panel.active { display: flex; }

        /* Canciones nivel secundario sin redirección externa */
        .music-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; margin-bottom: 15px; }
        .music-btn { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--neon-blue); 
            color: var(--neon-blue); padding: 8px 0; border-radius: 6px; font-size: 0.55em; 
            font-weight: bold; text-align: center; cursor: pointer;
        }

        /* Ruleta anterior */
        .wheel-container { position: relative; width: 250px; height: 250px; margin: 15px 0; }
        .pointer { 
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%); 
            width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
            border-top: 28px solid white; z-index: 10;
        }
        .wheel { 
            width: 100%; height: 100%; border-radius: 50%; border: 5px solid white;
            background: conic-gradient(
                var(--neon-pink) 0deg 45deg, var(--neon-purple) 45deg 90deg, 
                var(--neon-blue) 90deg 135deg, var(--neon-pink) 135deg 180deg, 
                var(--neon-purple) 180deg 225deg, var(--neon-blue) 225deg 270deg,
                var(--neon-pink) 270deg 315deg, var(--neon-purple) 315deg 360deg
            );
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .card { 
            background: var(--card-dark); width: 100%; min-height: 180px; border-radius: 20px; 
            perspective: 1000px; cursor: pointer; border: 1px solid #333; margin: 10px 0;
        }
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; min-height: 180px; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .front, .back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 25px; box-sizing: border-box; text-align: center; border-radius: 20px;
        }
        .back { transform: rotateY(180deg); color: var(--neon-blue); font-weight: bold; background: #16213e; }

        .btn-spin { 
            background: var(--neon-pink); color: white; border: none; padding: 15px 40px; 
            border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px var(--neon-pink); margin: 15px 0;
        }

        .controls { display: flex; gap: 10px; width: 100%; }
        .nav-btn { flex: 1; background: #333; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; }
        .contador { font-size: 0.8em; margin-bottom: 10px; opacity: 0.6; }
    </style>
</head>
<body>

    <div class="header">
        <div class="titulo-mau">Matriz de Aprendizaje Ubicuo (MAU)</div>
        <div class="subtitulo-mau">Innovación en Dispositivos Digitales Autogestivos</div>
        <div class="subtitulo-especifico">Consolidación Cognitiva</div>
        <div class="info-linea">Materia: Lengua - Recursos Poéticos y Canciones</div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('aprender', this)">📖 APRENDE</button>
        <button class="tab" onclick="switchTab('jugar', this)">🔥 TE DESAFÍO</button>
    </div>

    <div id="panel-aprender" class="panel active">
        <div class="music-grid">
            <button class="music-btn">♫ POP</button>
            <button class="music-btn">♫ ROCK</button>
            <button class="music-btn">♫ BEAT</button>
            <button class="music-btn">♫ TRAP</button>
        </div>

        <div class="contador"><span id="numAprender">1</span> / 30</div>

        <div class="card" onclick="this.classList.toggle('flipped')">
            <div class="card-inner">
                <div class="front" id="fAprender">Cargando...</div>
                <div class="back" id="bAprender">...</div>
            </div>
        </div>

        <div class="controls">
            <button class="nav-btn" onclick="move(-1)">← ANTERIOR</button>
            <button class="nav-btn" onclick="move(1)">SIGUIENTE →</button>
        </div>
    </div>

    <div id="panel-jugar" class="panel">
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel"></div>
        </div>
        <button class="btn-spin" onclick="spinWheel()">¡GIRAR RULETA!</button>
        <div class="card" id="cardJuego" onclick="this.classList.toggle('flipped')">
            <div class="card-inner">
                <div class="front" id="fJuego">Girá la ruleta</div>
                <div class="back" id="bJuego">...</div>
            </div>
        </div>
    </div>

    <script>
        const cards = [
            { f: "Verso", b: "Cada una de las líneas que conforman el poema o canción." },
            { f: "Estrofa", b: "Grupo de versos que se separan por un espacio en blanco." },
            { f: "Métrica", b: "La medida silábica de un verso según reglas rítmicas." },
            { f: "Sinalefa", b: "Unión de la última vocal de una palabra con la primera de la siguiente." },
            { f: "Arte Menor", b: "Versos que poseen de dos a ocho sílabas métricas." },
            { f: "Arte Mayor", b: "Versos que poseen nueve o más sílabas métricas." },
            { f: "Rima Consonante", b: "Coincidencia de vocales y consonantes desde la última tónica." },
            { f: "Rima Asonante", b: "Coincidencia solo de vocales desde la última vocal tónica." },
            { f: "Aguda (+1)", b: "Si la última palabra del verso es aguda, se suma una sílaba." },
            { f: "Esdrújula (-1)", b: "Si la última palabra del verso es esdrújula, se resta una sílaba." },
            { f: "Grave (0)", b: "Si la última palabra es grave, el número de sílabas no cambia." },
            { f: "Metáfora", b: "Comparación implícita que identifica dos realidades distintas." },
            { f: "Comparación", b: "Relación de semejanza explícita usando el nexo 'como'." },
            { f: "Personificación", b: "Otorgar rasgos humanos a objetos inanimados o animales." },
            { f: "Hipérbole", b: "Aumentar o disminuir de forma exagerada una idea." },
            { f: "Anáfora", b: "Repetición de una o más palabras al inicio del verso." },
            { f: "Aliteración", b: "Repetición de sonidos para lograr un efecto rítmico." },
            { f: "Encabalgamiento", b: "Cuando la frase no termina al final del verso, sino en el siguiente." },
            { f: "Octosílabo", b: "Verso de ocho sílabas, base de la poesía popular y canciones." },
            { f: "Endecasílabo", b: "Verso de once sílabas, propio de estrofas como el soneto." },
            { f: "Imagen Visual", b: "Uso de palabras para representar algo percibido por la vista." },
            { f: "Imagen Auditiva", b: "Uso de palabras que evocan un sonido o ruido específico." },
            { f: "Onomatopeya", b: "Palabra que imita el sonido de una acción o animal." },
            { f: "Paralelismo", b: "Repetición de una misma estructura sintáctica en varios versos." },
            { f: "Estribillo", b: "Verso o estrofa que se repite para marcar el ritmo de la canción." },
            { f: "Sinalefa con 'H'", b: "La 'H' inicial no impide la formación de sinalefa." },
            { f: "Pausa Versal", b: "Silencio que se produce al final de cada verso." },
            { f: "Verso Libre", b: "Versos que no siguen rima ni métrica fija." },
            { f: "Ritmo", b: "Efecto musical logrado por la distribución de acentos y pausas." },
            { f: "Recursos Estilísticos", b: "Herramientas que usa el autor para embellecer el lenguaje." }
        ];

        let idx = 0;
        let rotation = 0;

        function switchTab(mode, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('panel-' + mode).classList.add('active');
        }

        function move(dir) {
            idx = (idx + dir + cards.length) % cards.length;
            document.querySelector('#panel-aprender .card').classList.remove('flipped');
            setTimeout(() => {
                document.getElementById('fAprender').innerText = cards[idx].f;
                document.getElementById('bAprender').innerText = cards[idx].b;
                document.getElementById('numAprender').innerText = idx + 1;
            }, 150);
        }

        function spinWheel() {
            rotation += 1440 + Math.floor(Math.random() * 360);
            document.getElementById('wheel').style.transform = `rotate(${rotation}deg)`;
            document.getElementById('cardJuego').classList.remove('flipped');
            setTimeout(() => {
                const rIdx = Math.floor(Math.random() * cards.length);
                document.getElementById('fJuego').innerText = cards[rIdx].f;
                document.getElementById('bJuego').innerText = cards[rIdx].b;
            }, 4000);
        }

        move(0);
    </script>
</body>
</html>
